[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indranet"
version = "0.1.0"
description = "IndraNet's Python side: build and train decoder-only transformers with named hook points, and export them for the tfi reverse-engineering engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "transformers", "nanobind"]   # transformers: the converter's golden tests; nanobind: the tfi bindings' build
hf = ["huggingface_hub"]           # indranet_hf downloading from the Hub (local folders need only numpy)

[tool.setuptools.packages.find]
include = ["indranet*"]
# The tfi bindings (python/tfi) are a compiled module built in the repository with `make python`, used
# from there (pytest.ini puts python/ on the path), not shipped in the wheel.
